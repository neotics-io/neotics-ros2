name: Neotics kit
on:
  workflow_dispatch:
  push:
    paths:
      - 'neotics/**'
      - '.github/workflows/neotics.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    container: ros:jazzy
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: apt-get update && apt-get install -y --no-install-recommends liburdfdom-tools ros-jazzy-sensor-msgs python3-pytest python3-yaml python3-pil python3-numpy
      - name: Format and exporter tests
        run: python3 -m pytest -q neotics/tests
      - name: Full check in ROS 2
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          cd neotics
          python3 scene_to_urdf.py samples/depot.scene.json /tmp/arm.urdf
          check_urdf /tmp/arm.urdf
          colcon build --base-paths neotics_replay --build-base /tmp/nb --install-base /tmp/ni
          source /tmp/ni/setup.bash
          python3 tests/ci_ros2.py /tmp/arm.urdf
